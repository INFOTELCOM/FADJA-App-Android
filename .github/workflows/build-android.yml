name: Build FADJA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "FADJA-Flutter-Native/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: FADJA-Flutter-Native
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: FADJA-Flutter-Native
        run: flutter pub get

      - name: Build universal release APK
        working-directory: FADJA-Flutter-Native
        run: flutter build apk --release

      - name: Verify APK integrity and signature
        working-directory: FADJA-Flutter-Native
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: fadja-android-apk-verified
          path: FADJA-Flutter-Native/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
